<header class="signup-header">
  <div class="logo">
    <img src="LogoFychar.png" alt="FyChar logo" />
    <span>Fy<span class="highlight">Char</span></span>
  </div>

  <ol class="step-list">
    @for (step of steps; track step; let i = $index) {
      <li class="step" [class.done]="currentStep > i + 1" [class.active]="currentStep === i + 1">
        <div class="step-circle">
          @if (currentStep > i + 1) {
            ✓
          } @else {
            {{ i + 1 }}
          }
        </div>
        <span class="step-label">{{ step }}</span>
      </li>
    }
  </ol>

  <span class="help">? Precisa de ajuda?</span>

  @if (showBack) {
    <button class="back-button" type="button" (click)="goBack()">← Voltar</button>
  }
</header>
